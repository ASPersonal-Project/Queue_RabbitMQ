name: mern-stack-dev

services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      target: dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/mern-dev
      - REDIS_HOST=redis 
    depends_on:
      - mongo
      - redis
    networks:
      - mern-network 
  
  email-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      target: dev
    command: node worker-runner.js
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/mern-dev
      - REDIS_HOST=redis
    depends_on:
      - redis
      - mongo
    networks:
      - mern-network

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:4000
    depends_on:
      - backend-dev
    networks:
      - mern-network 

